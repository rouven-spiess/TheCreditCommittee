experiment:
  name: "baseline_tavily_7d"
  description: "Baseline experiment with 7-day time range for Tavily search"
  tags: ["baseline", "tavily"]

# Input data for the experiment
# This defines the Alpha Vantage ticker symbol to process
input_data:
  ticker: "ASML"  # Stock ticker symbol (e.g., "IBM", "AAPL", "MSFT")

tools:
  tavily:
    max_results: 5
    include_answer: true
    include_raw_content: false
    include_images: false
    search_depth: "advanced"
    time_range: "7d"  # Options: "1d", "7d", "30d", "1y", or null for all time
  
  alphavantage:
    function: "INCOME_STATEMENT"
  
  openai:
    enabled: true  # Enable OpenAI synthesis for search results
    model: "gpt-4o-mini"  # Options: "gpt-4o-mini", "gpt-4o", "gpt-3.5-turbo"
    temperature: 0.3  # Lower = more focused, Higher = more creative (0.0-1.0)

financials_schema:
  # Schema definition for financial data structure
  # These fields define what financial metrics are expected/used
  fields:
    - name: "revenue"
      type: "float"
      description: "Company revenue"
      required: true
    - name: "assets"
      type: "float"
      description: "Total assets"
      required: true
    - name: "equity"
      type: "float"
      description: "Shareholders' equity"
      required: true
    - name: "debt"
      type: "float"
      description: "Total debt"
      required: true
    - name: "cash"
      type: "float"
      description: "Cash and cash equivalents"
      required: true
    - name: "interest_coverage_ratio"
      type: "float"
      description: "Interest coverage ratio (EBIT / interest expense)"
      required: true
  
  # Default/mock values (used when AlphaVantage is not available)
  default_values:
    revenue: 5000000
    assets: 10000000
    equity: 5000000
    debt: 5000000
    cash: 1000000
    interest_coverage_ratio: 10

graph:
  nodes:
    - name: "sanitize_input"
      enabled: true
    - name: "due_diligence"
      enabled: true
    - name: "industry"
      enabled: true
    - name: "credit_risk"
      enabled: true
    - name: "credit_officer"
      enabled: true
  
  edges:
    - from: "sanitize_input"
      to: ["due_diligence", "credit_risk"]
    - from: "due_diligence"
      to: "industry"
    - from: "credit_risk"
      to: "industry"
    - from: "industry"
      to: "credit_officer"

decision_rules:
  altman_z_threshold: 2.6
  require_no_major_risks: true



