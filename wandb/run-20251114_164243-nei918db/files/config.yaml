decision_rules:
    value:
        altman_z_threshold: 2.6
        require_no_major_risks: true
experiment:
    value:
        description: Baseline experiment with 7-day time range for Tavily search
        name: baseline_tavily_7d
        tags:
            - baseline
            - tavily
financials_schema:
    value:
        default_values:
            assets: 10000000
            cash: 1000000
            debt: 5000000
            equity: 5000000
            interest_coverage_ratio: 10
            revenue: 5000000
        fields:
            - description: Company revenue
              name: revenue
              required: true
              type: float
            - description: Total assets
              name: assets
              required: true
              type: float
            - description: Shareholders' equity
              name: equity
              required: true
              type: float
            - description: Total debt
              name: debt
              required: true
              type: float
            - description: Cash and cash equivalents
              name: cash
              required: true
              type: float
            - description: Interest coverage ratio (EBIT / interest expense)
              name: interest_coverage_ratio
              required: true
              type: float
graph:
    value:
        edges:
            - from: sanitize_input
              to:
                - due_diligence
                - credit_risk
            - from: due_diligence
              to: industry
            - from: credit_risk
              to: industry
            - from: industry
              to: credit_officer
        nodes:
            - enabled: true
              name: sanitize_input
            - enabled: true
              name: due_diligence
            - enabled: true
              name: industry
            - enabled: true
              name: credit_risk
            - enabled: true
              name: credit_officer
input_data:
    value:
        ticker: IBM
tools:
